name: Commit Lint

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@v6
